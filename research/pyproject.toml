[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "janus-research"
version = "0.2.0"
description = "Falsification-first research harness for JANUS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "polars>=1.34,<2",
  "pyarrow>=25,<26",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "scikit-learn-stubs>=0.0.3,<0.1",
  "scipy-stubs>=1.18,<2",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
janus = "janus_research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["janus_research"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests"]
